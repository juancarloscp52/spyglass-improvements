plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }
    maven {
        name = "wispForestReleases"
        url = uri("https://maven.wispforest.io/releases")
    }
    maven { url 'https://maven.su5ed.dev/releases' } //Accessories
    maven {
        name = "Ladysnake Mods"
        url = 'https://maven.ladysnake.org/releases'
    }
    maven {  //trinkets
        name = "Nucleoid"
        url = 'https://maven.nucleoid.xyz/releases'
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    implementation "com.terraformersmc:modmenu:${rootProject.modmenu_version}"

    compileOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${rootProject.cc_version}"
    compileOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${rootProject.cc_version}"
    //compileOnly "dev.emi:trinkets:${rootProject.trinkets_version}" // Trinkets official
    compileOnly "eu.pb4:trinkets:${project.trinkets_version}" // trinkets updated

    //compileOnly("io.wispforest:accessories-fabric:${project.accessories_version}")

    common(project(path: ':common')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}


shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "" // Removes the '-all' suffix so it's the main jar
}

// Ensure the standard jar task is replaced by the shadowJar
tasks.build.dependsOn shadowJar